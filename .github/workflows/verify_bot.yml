name: Verify Telegram Bot Token

on:
  workflow_dispatch:

jobs:
  verify-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Telegram /getMe API
        run: |
          echo "Hitting Telegram API /getMe..."
          response=$(curl -s -X GET "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe")
          echo "API Response: $response"
          
          # If the response contains '"ok":false', exit and fail the action
          if echo "$response" | grep -q '"ok":false'; then
            echo "❌ ERROR: Telegram rejected the Token. Your TELEGRAM_TOKEN secret is invalid."
            exit 1
          else
            echo "✅ SUCCESS! The Bot token is valid and the bot is online."
          fi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
