name: Keep Render App Awake

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch:

jobs:
  ping_render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "::error::RENDER_APP_URL secret is not set! Please add your Render URL (like https://your-app.onrender.com) to Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          
          echo "Pinging $RENDER_APP_URL/ping..."
          curl -f -s "$RENDER_APP_URL/ping" || echo "Ping returned non-200, but keeping alive..."
