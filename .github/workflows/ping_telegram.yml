name: Ping Telegram Bot

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Message to send'
        required: true
        default: '✅ This is a test ping from GitHub Actions! Your Secrets are working perfectly.'

jobs:
  ping-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Send Test Ping to Telegram
        run: python .github/scripts/ping_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
